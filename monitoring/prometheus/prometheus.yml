# Prometheus du lab Docker. En VM, le rôle Ansible "monitoring" génère un fichier équivalent
# à partir de l'inventaire ; sur Kubernetes, ce sont les PodMonitor de platform/strimzi/monitoring.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: socle-lab
    environment: lab

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: kafka-controllers
    static_configs:
      - targets: ["controller-1:7071", "controller-2:7071", "controller-3:7071"]
    relabel_configs: &short_instance
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: instance
        replacement: "$1"

  - job_name: kafka-brokers
    static_configs:
      - targets: ["broker-1:7071", "broker-2:7071", "broker-3:7071"]
    relabel_configs: *short_instance

  - job_name: kafka-connect
    static_configs:
      - targets: ["connect:7072"]
    relabel_configs: *short_instance

  - job_name: schema-registry
    static_configs:
      - targets: ["schema-registry:7073"]
    relabel_configs: *short_instance

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
    relabel_configs:
      - target_label: instance
        replacement: docker-host

  - job_name: ingestion-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ingestion-api:8090"]
    relabel_configs: *short_instance

  - job_name: order-enrichment
    static_configs:
      - targets: ["order-enrichment:7074"]
    relabel_configs: *short_instance

  # Sondes de disponibilité des points d'entrée (servitudes et API REST).
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://schema-registry:8081/subjects
          - http://connect:8083/
          - http://ingestion-api:8090/actuator/health
          - http://namenode:9870/
          - http://grafana:3000/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["postgres:5432", "namenode:8020", "broker-1:19092", "broker-2:19092", "broker-3:19092"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
