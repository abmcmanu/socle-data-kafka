modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: []        # 2xx
      preferred_ip_protocol: ip4
  tcp_connect:
    prober: tcp
    timeout: 5s
  # Production : vérifie la poignée de main TLS et expose probe_ssl_earliest_cert_expiry.
  tls_connect:
    prober: tcp
    timeout: 5s
    tcp:
      tls: true
      tls_config:
        insecure_skip_verify: false
        # En production, ajouter : ca_file: /etc/blackbox/ca.crt (CA de la PKI interne)
