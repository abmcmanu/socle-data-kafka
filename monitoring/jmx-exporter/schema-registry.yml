# Règles JMX Exporter pour le Schema Registry.
lowercaseOutputName: true
lowercaseOutputLabelNames: true
rules:
  - pattern: kafka.schema.registry<type=jetty-metrics><>([a-z-]+)
    name: schema_registry_jetty_$1
    type: GAUGE
  - pattern: kafka.schema.registry<type=master-slave-role><>master-slave-role
    name: schema_registry_leader
    type: GAUGE
  - pattern: kafka.schema.registry<type=jersey-metrics><>(.+)-(request-error-rate|request-rate|request-latency-99)
    name: schema_registry_jersey_$2
    type: GAUGE
    labels:
      endpoint: "$1"
  - pattern: kafka.schema.registry<type=registered-count><>([a-z-]+)
    name: schema_registry_registered_$1
    type: GAUGE
