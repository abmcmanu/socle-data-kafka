# Mêmes configurations que connectors/lab/*.json, adaptées à l'environnement Kubernetes.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnector
metadata:
  name: crm-customers-cdc
  labels: {strimzi.io/cluster: socle-connect}
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1
  config:
    plugin.name: pgoutput
    database.hostname: crm-db.crm.svc
    database.port: 5432
    database.user: ${secrets:socle-data/crm-debezium:username}
    database.password: ${secrets:socle-data/crm-debezium:password}
    database.dbname: crm
    database.sslmode: require
    topic.prefix: crm
    table.include.list: public.customers
    column.exclude.list: public.customers.phone,public.customers.birth_date
    publication.name: dbz_crm_publication
    publication.autocreate.mode: disabled
    slot.name: debezium_crm
    snapshot.mode: initial
    decimal.handling.mode: string
    time.precision.mode: connect
    transforms: unwrap,route,key
    transforms.unwrap.type: io.debezium.transforms.ExtractNewRecordState
    transforms.unwrap.delete.tombstone.handling.mode: tombstone
    transforms.unwrap.add.fields: op,source.ts_ms
    transforms.route.type: org.apache.kafka.connect.transforms.RegexRouter
    transforms.route.regex: crm\.public\.customers
    transforms.route.replacement: crm.cdc.customers.v1
    transforms.key.type: org.apache.kafka.connect.transforms.ExtractField$Key
    transforms.key.field: id
    value.converter.auto.register.schemas: true
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnector
metadata:
  name: hdfs-sink
  labels: {strimzi.io/cluster: socle-connect}
spec:
  class: io.confluent.connect.hdfs.HdfsSinkConnector
  tasksMax: 6
  config:
    topics: orders.evt.order-enriched.v1,analytics.agg.revenue-by-country-1m.v1,crm.cdc.customers.v1
    hdfs.url: hdfs://nn-ha.datalake.interne:8020
    # Data lake kerberisé (servitude S-07) : keytab monté depuis un Secret.
    hdfs.authentication.kerberos: true
    connect.hdfs.principal: kafka-connect/_HOST@DATALAKE.INTERNE
    connect.hdfs.keytab: /mnt/hdfs-keytab/kafka-connect.keytab
    hdfs.namenode.principal: nn/_HOST@DATALAKE.INTERNE
    topics.dir: /data/raw
    logs.dir: /data/connect-wal
    format.class: io.confluent.connect.hdfs.avro.AvroFormat
    flush.size: 10000
    rotate.interval.ms: 600000
    partitioner.class: io.confluent.connect.storage.partitioner.TimeBasedPartitioner
    partition.duration.ms: 86400000
    path.format: "'dt'=YYYY-MM-dd"
    locale: fr-FR
    timezone: UTC
    timestamp.extractor: Record
    consumer.override.isolation.level: read_committed
    transforms: dropTombstones,maskEmail
    transforms.dropTombstones.type: org.apache.kafka.connect.transforms.Filter
    transforms.dropTombstones.predicate: isTombstone
    transforms.maskEmail.type: org.apache.kafka.connect.transforms.MaskField$Value
    transforms.maskEmail.fields: email
    transforms.maskEmail.predicate: isCustomers
    predicates: isTombstone,isCustomers
    predicates.isTombstone.type: org.apache.kafka.connect.transforms.predicates.RecordIsTombstone
    predicates.isCustomers.type: org.apache.kafka.connect.transforms.predicates.TopicNameMatches
    predicates.isCustomers.pattern: crm\.cdc\.customers\.v1
    errors.tolerance: all
    errors.deadletterqueue.topic.name: platform.dlq.hdfs-sink.v1
    errors.deadletterqueue.topic.replication.factor: 3
    errors.deadletterqueue.context.headers.enable: true
    errors.log.enable: true
