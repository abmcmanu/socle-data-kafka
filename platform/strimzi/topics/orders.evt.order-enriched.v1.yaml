apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: orders.evt.order-enriched.v1
  labels:
    strimzi.io/cluster: socle
  annotations:
    socle.io/owner: equipe-data-plateforme
    socle.io/description: Commande enrichie avec le segment et le pays du client.
      Clé = orderId.
spec:
  topicName: orders.evt.order-enriched.v1
  partitions: 12
  replicas: 3
  config:
    min.insync.replicas: '2'
    unclean.leader.election.enable: 'false'
    compression.type: producer
    cleanup.policy: delete
    retention.ms: '1209600000'
