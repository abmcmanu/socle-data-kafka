# FICHIER GÉNÉRÉ par tools/topics.py — modifier governance/topics/catalog.yaml
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: platform.connect.offsets
  labels:
    strimzi.io/cluster: socle
  annotations:
    socle.io/owner: equipe-data-plateforme
    socle.io/description: Offsets des connecteurs source (interne Kafka Connect).
spec:
  topicName: _platform.connect.offsets
  partitions: 25
  replicas: 3
  config:
    min.insync.replicas: '2'
    unclean.leader.election.enable: 'false'
    compression.type: producer
    cleanup.policy: compact
