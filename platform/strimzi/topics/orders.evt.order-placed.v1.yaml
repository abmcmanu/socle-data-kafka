# FICHIER GÉNÉRÉ par tools/topics.py — modifier governance/topics/catalog.yaml
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: orders.evt.order-placed.v1
  labels:
    strimzi.io/cluster: socle
  annotations:
    socle.io/owner: equipe-commandes
    socle.io/description: Commande validée par l'API d'ingestion. Clé = orderId.
spec:
  topicName: orders.evt.order-placed.v1
  partitions: 12
  replicas: 3
  config:
    min.insync.replicas: '2'
    unclean.leader.election.enable: 'false'
    compression.type: producer
    cleanup.policy: delete
    retention.ms: '604800000'
    max.message.bytes: '1048576'
