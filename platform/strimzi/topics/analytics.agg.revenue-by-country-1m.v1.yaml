apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: analytics.agg.revenue-by-country-1m.v1
  labels:
    strimzi.io/cluster: socle
  annotations:
    socle.io/owner: equipe-data-plateforme
    socle.io/description: Chiffre d'affaires et nombre de commandes par pays et devise,
      fenêtre d'une minute.
spec:
  topicName: analytics.agg.revenue-by-country-1m.v1
  partitions: 6
  replicas: 3
  config:
    min.insync.replicas: '2'
    unclean.leader.election.enable: 'false'
    compression.type: producer
    cleanup.policy: delete
    retention.ms: '2592000000'
