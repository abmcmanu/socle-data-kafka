# Lab complet du socle data : make up (depuis la racine du dépôt).
# Topologie identique à la production : 3 contrôleurs KRaft + 3 brokers dédiés, un par « zone ».
# Les ressources sont réduites pour tenir sur un poste de travail (~10-12 Go de RAM).
# Ordre de démarrage maîtrisé par depends_on (voir docs/exploitation/02-procedures-arret-relance.md).
name: socle-data

x-kafka-base: &kafka-base
  image: apache/kafka:${KAFKA_IMAGE_TAG:-4.1.2}
  restart: unless-stopped
  depends_on:
    lab-init:
      condition: service_completed_successfully
  volumes:
    - jmx-agent:/opt/jmx:ro
    - ../../monitoring/jmx-exporter/kafka-broker.yml:/etc/jmx/kafka-broker.yml:ro

x-controller-env: &controller-env
  CLUSTER_ID: ${CLUSTER_ID}
  KAFKA_PROCESS_ROLES: controller
  KAFKA_LISTENERS: CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
  KAFKA_OPTS: -javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=7071:/etc/jmx/kafka-broker.yml

x-broker-env: &broker-env
  CLUSTER_ID: ${CLUSTER_ID}
  KAFKA_PROCESS_ROLES: broker
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  # Durabilité : identique à la production (ADR 0005)
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"           # gouvernance as code (ADR 0006)
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_REPLICA_SELECTOR_CLASS: org.apache.kafka.common.replica.RackAwareReplicaSelector
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
  KAFKA_OPTS: -javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=7071:/etc/jmx/kafka-broker.yml

x-broker-healthcheck: &broker-healthcheck
  test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
  interval: 20s
  timeout: 15s
  retries: 10
  start_period: 30s

x-controller-healthcheck: &controller-healthcheck
  test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9093' && bash -c '</dev/tcp/localhost/7071'"]
  interval: 10s
  timeout: 5s
  retries: 12

services:
  # ---------------------------------------------------------------- initialisation
  # Télécharge l'agent JMX Exporter et donne les volumes de données à l'utilisateur Kafka (uid 1000).
  lab-init:
    image: curlimages/curl:8.11.1
    user: "0"
    command:
      - sh
      - -c
      - |
        set -e
        JAR=/opt/jmx/jmx_prometheus_javaagent.jar
        [ -s "$$JAR" ] || curl -fsSL -o "$$JAR" \
          https://repo1.maven.org/maven2/io/prometheus/jmx/jmx_prometheus_javaagent/${JMX_EXPORTER_VERSION}/jmx_prometheus_javaagent-${JMX_EXPORTER_VERSION}.jar
        chown -R 1000:1000 /data/*
        echo "lab-init terminé"
    volumes:
      - jmx-agent:/opt/jmx
      - controller-1-data:/data/c1
      - controller-2-data:/data/c2
      - controller-3-data:/data/c3
      - broker-1-data:/data/b1
      - broker-2-data:/data/b2
      - broker-3-data:/data/b3

  # ---------------------------------------------------------------- quorum KRaft
  controller-1:
    <<: *kafka-base
    hostname: controller-1
    environment: {<<: *controller-env, KAFKA_NODE_ID: 1}
    volumes: [jmx-agent:/opt/jmx:ro, ../../monitoring/jmx-exporter/kafka-broker.yml:/etc/jmx/kafka-broker.yml:ro, controller-1-data:/var/lib/kafka/data]
    healthcheck: *controller-healthcheck

  controller-2:
    <<: *kafka-base
    hostname: controller-2
    environment: {<<: *controller-env, KAFKA_NODE_ID: 2}
    volumes: [jmx-agent:/opt/jmx:ro, ../../monitoring/jmx-exporter/kafka-broker.yml:/etc/jmx/kafka-broker.yml:ro, controller-2-data:/var/lib/kafka/data]
    healthcheck: *controller-healthcheck

  controller-3:
    <<: *kafka-base
    hostname: controller-3
    environment: {<<: *controller-env, KAFKA_NODE_ID: 3}
    volumes: [jmx-agent:/opt/jmx:ro, ../../monitoring/jmx-exporter/kafka-broker.yml:/etc/jmx/kafka-broker.yml:ro, controller-3-data:/var/lib/kafka/data]
    healthcheck: *controller-healthcheck

  # ---------------------------------------------------------------- brokers
  broker-1:
    <<: *kafka-base
    hostname: broker-1
    depends_on: &brokers-depend
      controller-1: {condition: service_healthy}
      controller-2: {condition: service_healthy}
      controller-3: {condition: service_healthy}
    ports: ["9092:9092"]
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 101
      KAFKA_BROKER_RACK: zone-a
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker-1:19092,EXTERNAL://localhost:9092
    volumes: [jmx-agent:/opt/jmx:ro, ../../monitoring/jmx-exporter/kafka-broker.yml:/etc/jmx/kafka-broker.yml:ro, broker-1-data:/var/lib/kafka/data]
    healthcheck: *broker-healthcheck

  broker-2:
    <<: *kafka-base
    hostname: broker-2
    depends_on: *brokers-depend
    ports: ["9192:9092"]
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 102
      KAFKA_BROKER_RACK: zone-b
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker-2:19092,EXTERNAL://localhost:9192
    volumes: [jmx-agent:/opt/jmx:ro, ../../monitoring/jmx-exporter/kafka-broker.yml:/etc/jmx/kafka-broker.yml:ro, broker-2-data:/var/lib/kafka/data]
    healthcheck: *broker-healthcheck

  broker-3:
    <<: *kafka-base
    hostname: broker-3
    depends_on: *brokers-depend
    ports: ["9292:9092"]
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 103
      KAFKA_BROKER_RACK: zone-c
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker-3:19092,EXTERNAL://localhost:9292
    volumes: [jmx-agent:/opt/jmx:ro, ../../monitoring/jmx-exporter/kafka-broker.yml:/etc/jmx/kafka-broker.yml:ro, broker-3-data:/var/lib/kafka/data]
    healthcheck: *broker-healthcheck

  # Applique le catalogue des topics (governance/topics/catalog.yaml) : idempotent.
  topics-init:
    image: apache/kafka:${KAFKA_IMAGE_TAG:-4.1.2}
    depends_on: &all-brokers
      broker-1: {condition: service_healthy}
      broker-2: {condition: service_healthy}
      broker-3: {condition: service_healthy}
    environment:
      BOOTSTRAP: broker-1:19092,broker-2:19092,broker-3:19092
    entrypoint: ["bash", "/governance/generated/create-topics.sh"]
    volumes:
      - ../../governance:/governance:ro

  # ---------------------------------------------------------------- Schema Registry
  schema-registry:
    image: confluentinc/cp-schema-registry:${CONFLUENT_VERSION:-8.0.0}
    hostname: schema-registry
    restart: unless-stopped
    depends_on:
      topics-init: {condition: service_completed_successfully}
      lab-init: {condition: service_completed_successfully}
    ports: ["8081:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://broker-1:19092,PLAINTEXT://broker-2:19092,PLAINTEXT://broker-3:19092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward_transitive
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms256m -Xmx256m
      EXTRA_ARGS: -javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=7073:/etc/jmx/schema-registry.yml
    volumes:
      - jmx-agent:/opt/jmx:ro
      - ../../monitoring/jmx-exporter/schema-registry.yml:/etc/jmx/schema-registry.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Enregistre les schémas Avro de governance/schemas (contrôle de compatibilité inclus).
  schemas-init:
    image: python:3.12-alpine
    depends_on:
      schema-registry: {condition: service_healthy}
    command: ["python3", "/repo/tools/register_schemas.py", "--url", "http://schema-registry:8081"]
    volumes:
      - ../../tools:/repo/tools:ro
      - ../../governance:/repo/governance:ro

  # ---------------------------------------------------------------- base source CRM
  postgres:
    image: postgres:16.4
    hostname: postgres
    restart: unless-stopped
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_admin -d crm"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------- data lake Hadoop (lab)
  namenode:
    image: apache/hadoop:${HADOOP_VERSION:-3.4.1}
    hostname: namenode
    restart: unless-stopped
    command: ["hdfs", "namenode"]
    ports: ["9870:9870"]
    env_file: [../../hadoop/config/hadoop.env]
    environment:
      ENSURE_NAMENODE_DIR: /tmp/hadoop-root/dfs/name
    # Lab : données HDFS dans le conteneur (conservées par stop/start, perdues par down).
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9870/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20

  datanode:
    image: apache/hadoop:${HADOOP_VERSION:-3.4.1}
    hostname: datanode
    restart: unless-stopped
    command: ["hdfs", "datanode"]
    depends_on:
      namenode: {condition: service_healthy}
    env_file: [../../hadoop/config/hadoop.env]

  # ---------------------------------------------------------------- Kafka Connect
  connect:
    build:
      context: ../../connectors
      args:
        CONFLUENT_VERSION: ${CONFLUENT_VERSION:-8.0.0}
        HDFS_CONNECTOR_VERSION: ${HDFS_CONNECTOR_VERSION}
    image: socle/kafka-connect:local
    hostname: connect
    restart: unless-stopped
    depends_on:
      schemas-init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      namenode: {condition: service_healthy}
    ports: ["8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: broker-1:19092,broker-2:19092,broker-3:19092
      GROUP_ID: connect-socle
      CONFIG_STORAGE_TOPIC: _platform.connect.configs
      OFFSET_STORAGE_TOPIC: _platform.connect.offsets
      STATUS_STORAGE_TOPIC: _platform.connect.status
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_CONFIG_PROVIDERS: file
      CONNECT_CONFIG_PROVIDERS_FILE_CLASS: org.apache.kafka.common.config.provider.FileConfigProvider
      # Autorise consumer.override.* dans les connecteurs (isolation.level=read_committed du sink HDFS)
      CONNECT_CONNECTOR_CLIENT_CONFIG_OVERRIDE_POLICY: All
      HEAP_OPTS: -Xms512m -Xmx1g
      KAFKA_OPTS: -javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=7072:/etc/jmx/kafka-connect.yml
    volumes:
      - jmx-agent:/opt/jmx:ro
      - ../../monitoring/jmx-exporter/kafka-connect.yml:/etc/jmx/kafka-connect.yml:ro
      - ./config/connect-secrets.properties:/opt/secrets/connect-secrets.properties:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/connectors >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Déploie les connecteurs (PUT /connectors/<nom>/config : idempotent).
  connectors-init:
    image: curlimages/curl:8.11.1
    depends_on:
      connect: {condition: service_healthy}
    entrypoint: ["sh", "/repo/scripts/ops/deploy-connectors.sh", "http://connect:8083", "/repo/connectors/lab"]
    volumes:
      - ../../scripts:/repo/scripts:ro
      - ../../connectors:/repo/connectors:ro

  # ---------------------------------------------------------------- applications
  ingestion-api:
    build: {context: ../../services/ingestion-api}
    image: socle/ingestion-api:local
    hostname: ingestion-api
    restart: unless-stopped
    depends_on:
      schemas-init: {condition: service_completed_successfully}
    ports: ["8090:8090"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker-1:19092,broker-2:19092,broker-3:19092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      JAVA_TOOL_OPTIONS: -Xmx256m

  order-enrichment:
    build: {context: ../../services/order-enrichment}
    image: socle/order-enrichment:local
    hostname: order-enrichment
    restart: unless-stopped
    depends_on:
      schemas-init: {condition: service_completed_successfully}
      connectors-init: {condition: service_completed_successfully}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker-1:19092,broker-2:19092,broker-3:19092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      STATE_DIR: /var/lib/order-enrichment
      JAVA_TOOL_OPTIONS: -Xmx384m -javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=7074:/etc/jmx/kafka-streams.yml
    volumes:
      - jmx-agent:/opt/jmx:ro
      - ../../monitoring/jmx-exporter/kafka-streams.yml:/etc/jmx/kafka-streams.yml:ro
      - enrichment-state:/var/lib/order-enrichment

  # ---------------------------------------------------------------- supervision
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    restart: unless-stopped
    depends_on: *all-brokers
    command:
      - --kafka.server=broker-1:19092
      - --kafka.server=broker-2:19092
      - --kafka.server=broker-3:19092
      - --kafka.version=3.6.0
      - --group.filter=.*

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    pid: host
    command: ["--path.rootfs=/host"]
    volumes: ["/:/host:ro,rslave"]

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes: ["../../monitoring/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro"]

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    ports: ["9090:9090"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ../../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    ports: ["9093:9093"]
    volumes:
      - ../../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/socle-overview.json
      GF_USERS_DEFAULT_LANGUAGE: fr-FR
    volumes:
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.2.0
    restart: unless-stopped
    depends_on: *all-brokers
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: socle-lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker-1:19092,broker-2:19092,broker-3:19092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect-socle
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083

volumes:
  jmx-agent:
  controller-1-data:
  controller-2-data:
  controller-3-data:
  broker-1-data:
  broker-2-data:
  broker-3-data:
  postgres-data:
  enrichment-state:
  prometheus-data:
  grafana-data:
