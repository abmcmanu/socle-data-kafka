socle_java_package: openjdk-21-jre-headless
socle_ntp_servers: []
socle_sysctl:
  vm.swappiness: 1                   # le page cache sert Kafka : éviter le swap
  vm.dirty_background_ratio: 5
  vm.dirty_ratio: 60
  vm.max_map_count: 262144           # nombreux segments mmap (index)
  net.core.somaxconn: 4096
  net.ipv4.tcp_max_syn_backlog: 4096
  fs.file-max: 1000000
socle_nofile_limit: 128000
