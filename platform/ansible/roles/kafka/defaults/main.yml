kafka_version: "4.1.2"
kafka_scala_version: "2.13"
# Production : remplacer par le dépôt d'artefacts interne (servitude S-10).
kafka_download_url: "https://archive.apache.org/dist/kafka/{{ kafka_version }}/kafka_{{ kafka_scala_version }}-{{ kafka_version }}.tgz"
# SHA-512 du tgz (publié sur la page de téléchargement Apache). Obligatoire en production.
kafka_sha512: ""
kafka_install_dir: /opt/kafka
kafka_conf_dir: /etc/kafka
kafka_log_dirs: ["/var/lib/kafka/data"]
kafka_app_log_dir: /var/log/kafka

kafka_security_enabled: false
kafka_sasl_mechanism: SCRAM-SHA-512
kafka_client_port: 9092
kafka_internal_port: 9094
kafka_controller_port: 9093

# Rôle KRaft du nœud, déduit de son groupe d'inventaire.
kafka_process_role: "{{ 'controller' if inventory_hostname in groups['kafka_controllers'] else 'broker' }}"
kafka_heap_opts: "{{ kafka_heap_controller if kafka_process_role == 'controller' else kafka_heap_broker }}"
kafka_heap_broker: "-Xms1g -Xmx1g"
kafka_heap_controller: "-Xms512m -Xmx512m"

kafka_jmx_exporter_port: 7071
kafka_jmx_exporter_jar: /opt/jmx-exporter/jmx_prometheus_javaagent.jar

kafka_broker_config:
  default.replication.factor: 3
  min.insync.replicas: 2
  offsets.topic.replication.factor: 3
  transaction.state.log.replication.factor: 3
  transaction.state.log.min.isr: 2
  unclean.leader.election.enable: false
  auto.create.topics.enable: false
  num.partitions: 3
  num.network.threads: 6
  num.io.threads: 16
  num.replica.fetchers: 4
  log.retention.hours: 168
  log.segment.bytes: 1073741824
  replica.selector.class: org.apache.kafka.common.replica.RackAwareReplicaSelector
  controlled.shutdown.enable: true
  group.initial.rebalance.delay.ms: 3000
