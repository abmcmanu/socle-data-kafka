# Inventaire de production : une machine par rôle et par zone (voir docs/architecture/05-dimensionnement.md).
all:
  vars:
    ansible_user: deploy
    socle_env: prod
  children:
    kafka_controllers:
      hosts:
        kctl-a.socle.interne: {kafka_node_id: 1, kafka_rack: zone-a}
        kctl-b.socle.interne: {kafka_node_id: 2, kafka_rack: zone-b}
        kctl-c.socle.interne: {kafka_node_id: 3, kafka_rack: zone-c}
    kafka_brokers:
      hosts:
        kbrk-a1.socle.interne: {kafka_node_id: 101, kafka_rack: zone-a}
        kbrk-b1.socle.interne: {kafka_node_id: 102, kafka_rack: zone-b}
        kbrk-c1.socle.interne: {kafka_node_id: 103, kafka_rack: zone-c}
    schema_registry:
      hosts:
        ksr-a.socle.interne: {}
        ksr-b.socle.interne: {}
    kafka_connect:
      hosts:
        kcon-a.socle.interne: {}
        kcon-b.socle.interne: {}
    monitoring:
      hosts:
        kmon.socle.interne: {}
    socle_apps:
      hosts:
        kapp-a.socle.interne: {}
        kapp-b.socle.interne: {}
    kafka_cluster:
      children:
        kafka_controllers:
        kafka_brokers:
