# Inventaire de lab : 6 VM (par exemple Vagrant/Multipass). Contrôleurs et brokers séparés comme en production.
all:
  vars:
    ansible_user: ubuntu
    socle_env: lab
  children:
    kafka_controllers:
      hosts:
        kctl-1: {ansible_host: 192.168.56.11, kafka_node_id: 1, kafka_rack: zone-a}
        kctl-2: {ansible_host: 192.168.56.12, kafka_node_id: 2, kafka_rack: zone-b}
        kctl-3: {ansible_host: 192.168.56.13, kafka_node_id: 3, kafka_rack: zone-c}
    kafka_brokers:
      hosts:
        kbrk-1: {ansible_host: 192.168.56.21, kafka_node_id: 101, kafka_rack: zone-a}
        kbrk-2: {ansible_host: 192.168.56.22, kafka_node_id: 102, kafka_rack: zone-b}
        kbrk-3: {ansible_host: 192.168.56.23, kafka_node_id: 103, kafka_rack: zone-c}
    schema_registry:
      hosts:
        kbrk-1: {}
    kafka_connect:
      hosts:
        kbrk-2: {}
    monitoring:
      hosts:
        kbrk-3: {}
    socle_apps:
      hosts:
        kbrk-3: {}
    kafka_cluster:
      children:
        kafka_controllers:
        kafka_brokers:
